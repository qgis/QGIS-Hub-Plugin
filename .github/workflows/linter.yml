name: "✅ Linter"

on:
  push:
    branches: [ main ]
    paths:
      - '**.py'

  pull_request:
    branches: [ main ]
    paths:
      - '**.py'

env:
  PROJECT_FOLDER: "qgis_hub_plugin"
  PYTHON_VERSION: "3.12"


jobs:
  lint-py:
    name: Python 🐍

    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install project requirements
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -U flake8 flake8-qgis bandit

      # plugins.qgis.org also runs flake8 on upload (informational), config in setup.cfg
      - name: Lint with flake8
        run: flake8 ${{ env.PROJECT_FOLDER }} --show-source

      # same security scan as plugins.qgis.org, which blocks the upload on findings
      - name: Security scan with bandit
        run: bandit -r ${{ env.PROJECT_FOLDER }}
